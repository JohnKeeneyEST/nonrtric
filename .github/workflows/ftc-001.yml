name: FTC1 - Basic Sanity Test

on:
  workflow_dispatch:
    inputs:
      test_env_file:
        description: 'Test environment file to use'
        required: true
        default: '../common/test_env-onap-master.sh'
        type: choice
        options:
          - '../common/test_env-onap-master.sh'
          - '../common/test_env-oran-master.sh'
          - '../common/test_env-oran-n-release.sh'
          - '../common/test_env-oran-m-release.sh'
          - '../common/test_env-oran-l-release.sh'
          - '../common/test_env-oran-k-release.sh'
          - '../common/test_env-onap-rabat.sh'
          - '../common/test_env-onap-quebec.sh'
          - '../common/test_env-onap-paris.sh'
          - '../common/test_env-onap-oslo.sh'
          - '../common/test_env-onap-montreal.sh'
          - '../common/test_env-onap-newdelhi.sh'
          - '../common/onap_ftc_job_env.sh'
      execution_mode:
        description: 'Execution mode'
        required: true
        default: 'remote-remove docker'
        type: choice
        options:
          - 'remote docker'
          - 'remote-remove docker'
      image_mode:
        description: 'Image mode (e.g. "release") - optional'
        required: false
        type: string
      additional_params:
        description: 'Additional directives (e.g. "--use-snapshot-image A1PMS --use-release-image SDNC") - optional'
        required: false
        type: string

jobs:
  ftc1-test:
    uses: ./.github/workflows/ftc-test-template.yml
    with:
      test_case: 'FTC1'
      test_env_file: ${{ inputs.test_env_file }}
      execution_mode: ${{ inputs.execution_mode }}
      image_mode: ${{ inputs.image_mode }}
      additional_params: ${{ inputs.additional_params }}
      timeout_minutes: 120
